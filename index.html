<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Entry System</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Data Entry System</h1>
        
        <!-- Employee Form -->
        <div class="form-section">
            <h2>Employee Details</h2>
            <form id="employeeForm">
                <div class="form-group">
                    <label for="empId">Em ID:</label>
                    <input type="text" id="empId" name="empId" required>
                </div>
                <div class="form-group">
                    <label for="empName">Em Name:</label>
                    <input type="text" id="empName" name="empName" required>
                </div>
                <div class="form-group">
                    <label for="empAddress">Address:</label>
                    <input type="text" id="empAddress" name="empAddress" required>
                </div>
                <button type="submit" class="btn-submit">Submit</button>
            </form>
        </div>

        <!-- Project Form -->
        <div class="form-section">
            <h2>Project Details</h2>
            <form id="projectForm">
                <div class="form-group">
                    <label for="projectId">Project ID:</label>
                    <input type="text" id="projectId" name="projectId" required>
                </div>
                <div class="form-group">
                    <label for="projectName">Project Name:</label>
                    <input type="text" id="projectName" name="projectName" required>
                </div>
                <button type="submit" class="btn-submit">Submit</button>
            </form>
        </div>

        <!-- Display Area for Employees -->
        <div class="display-section">
            <h2>Employee Records</h2>
            <table id="employeeTable">
                <thead>
                    <tr>
                        <th>Em ID</th>
                        <th>Em Name</th>
                        <th>Address</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="employeeTableBody">
                    <!-- Employee records will be inserted here -->
                </tbody>
            </table>
            <p id="employeeEmptyMessage" class="empty-message">No employee records found.</p>
        </div>

        <!-- Display Area for Projects -->
        <div class="display-section">
            <h2>Project Records</h2>
            <table id="projectTable">
                <thead>
                    <tr>
                        <th>Project ID</th>
                        <th>Project Name</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="projectTableBody">
                    <!-- Project records will be inserted here -->
                </tbody>
            </table>
            <p id="projectEmptyMessage" class="empty-message">No project records found.</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
